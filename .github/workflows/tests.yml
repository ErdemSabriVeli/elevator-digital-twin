name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Godot headless test suites
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"

    steps:
      - uses: actions/checkout@v7

      - name: Download Godot
        run: |
          BASE="https://github.com/godotengine/godot/releases/download"
          FILE="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -sSfL -o godot.zip "${BASE}/${GODOT_VERSION}-stable/${FILE}.zip"
          unzip -q godot.zip
          mv "${FILE}" godot-bin
          chmod +x godot-bin
          ./godot-bin --version

      - name: Import project
        # On first open Godot builds the .godot/ cache and the global class
        # registry. Without this step class_name references do not resolve.
        run: ./godot-bin --headless --path godot --import

      - name: ST static lint
        run: ./godot-bin --headless --path godot --script res://tests/st_lint_test.gd

      - name: ST - GDScript parity
        run: ./godot-bin --headless --path godot --script res://tests/parity_test.gd

      - name: Mechanical layout
        run: ./godot-bin --headless --path godot --script res://tests/geometry_test.gd

      - name: Control logic scenarios
        run: ./godot-bin --headless --path godot --script res://tests/sim_test.gd

      - name: Modbus TCP protocol
        run: ./godot-bin --headless --path godot --script res://tests/modbus_test.gd
